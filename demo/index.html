<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SolidWorks Viewer PoC</title>
    <style>
      html, body { margin: 0; height: 100%; font: 14px system-ui, sans-serif; color: #1f2937; background: #fff; }
      #app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
      header { display: flex; gap: 16px; align-items: center; padding: 8px 16px; border-bottom: 1px solid #e5e7eb; flex-wrap: wrap; }
      header h1 { font-size: 15px; margin: 0; }
      #info { color: #6b7280; font-variant-numeric: tabular-nums; }
      #warn { color: #b45309; }
      #stage { position: relative; min-height: 0; }
      #drop { position: absolute; inset: 16px; border: 2px dashed #cbd5e1; border-radius: 8px; display: flex;
              align-items: center; justify-content: center; color: #64748b; pointer-events: none; text-align: center; }
      #stage.over #drop { border-color: #2563eb; color: #2563eb; }
      #preview { position: absolute; inset: 0; margin: auto; max-width: 90%; max-height: 90%; display: none; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>SolidWorks Viewer PoC</h1>
        <input id="file" type="file" accept=".sldprt,.sldasm" />
        <span id="info"></span>
        <span id="warn"></span>
      </header>
      <div id="stage">
        <div id="drop">.SLDPRT oder .SLDASM hierher ziehen oder oben auswählen</div>
        <img id="preview" alt="Vorschaubild aus der Datei" />
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
