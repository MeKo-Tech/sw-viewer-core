<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SolidWorks Viewer React</title>
    <style>
      html, body, #root { margin: 0; height: 100%; font: 14px system-ui, sans-serif; color: #1f2937; background: #fff; }
      .app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; }
      header { display: flex; gap: 16px; align-items: center; padding: 8px 16px; border-bottom: 1px solid #e5e7eb; flex-wrap: wrap; }
      header h1 { font-size: 15px; margin: 0; }
      .status { color: #6b7280; }
      .warn { color: #b45309; }
      .error { color: #b91c1c; }
      .viewer { min-height: 0; height: 100%; }
      header label { display: inline-flex; gap: 4px; align-items: center; }
      .overlay { position: absolute; top: 12px; left: 12px; padding: 4px 8px; border-radius: 4px; background: rgb(255 255 255 / 0.85); color: #374151; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./react.tsx"></script>
  </body>
</html>
